<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>go + wex — панель демо</title>
    <!-- Зелёная точка вкладки: без файла браузер просит /favicon.ico и получает 404. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!--
        Исходник стилей — Less. less.js компилирует его в браузере,
        поэтому сборщик для CSS не нужен. Скрипт идёт сразу после link:
        он ищет все ссылки с rel="stylesheet/less".
    -->
    <link rel="stylesheet/less" type="text/css" href="/style.less">
    <script src="/vendor/less.js"></script>
</head>
<body>
    <!--
        Шаблон wex. Движок читает его содержимое как виртуальное дерево
        и вставляет отрисованный результат после самого <template>.
        Идентификатор app — точка привязки для $('#app') в app.js.
    -->
    <template id="app">
        <main class="panel">
            <!--
                Шапка берёт тексты из словаря: они приходят данными вместе
                с остальным стейтом, поэтому блок больше не помечен w-static —
                при смене языка его нужно перерисовать.
            -->
            <header class="head">
                <h1 class="title">{{ texts.common.title }}</h1>
                <p class="lead">
                    {{ texts.common.lead }}
                </p>
            </header>

            <p class="failure" w-if="failure">{{ failure }}</p>
            <!--
                Отказ словаря показывается отдельно: снимок данных стирает
                общий failure, а страница без подписей должна объяснить, что
                случилось.
            -->
            <p class="failure" w-if="langError">{{ langError }}</p>

            <!-- Тексты секции лежат в lang/ru-RU/core.json: контекст — файл,
                 ключ — адрес внутри него. Разметка в переводе пока не
                 поддерживается, поэтому имена пакетов названы в тексте словами. -->
            <section class="block">
                <h2 class="caption">
                    {{ texts.core.title }}
                    <span class="engine">engine/core</span>
                </h2>
                <p class="note">
                    {{ texts.core.note_intro }}
                </p>
                <p class="note">
                    {{ texts.core.note_word }}
                </p>
            </section>

            <!--
                Тексты секции лежат в lang/ru-RU/httpapi.json: ключ — адрес
                внутри контекста, и файл называется по разделу, а не по пакету.
                Разметка внутри перевода (например, <code> вокруг адреса
                запроса) пока не поддерживается: подставляется только текст,
                поэтому адрес назван словами. Как переводить текст с разметкой
                — отдельное решение, а не побочный эффект этой правки.
            -->
            <section class="block">
                <h2 class="caption">
                    {{ texts.httpapi.connect_title }}
                    <span class="engine">engine/httpapi</span>
                </h2>
                <p class="note">
                    {{ texts.httpapi.connect_note }}
                </p>
                <div class="probe">
                    <p class="status" w-class="{ 'ok': ok, 'error': !checking && !ok }">
                        <span class="dot"></span>{{ status }}
                    </p>
                    <button class="button" w-on="click:check" w-disabled="checking">{{ texts.httpapi.connect_button }}</button>
                </div>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.httpapi.stream_title }}
                    <span class="engine">engine/httpapi</span>
                </h2>
                <p class="note">
                    {{ texts.httpapi.stream_note }}
                </p>
                <div class="line">
                    <input class="input" type="number" min="1" max="20" w-bind="streamCount" placeholder="{{ texts.httpapi.stream_count }}">
                    <input class="input" type="number" min="0" max="5000" w-bind="streamMs" placeholder="{{ texts.httpapi.stream_pause }}">
                    <button class="button" w-on="click:startStream">{{ texts.httpapi.stream_start }}</button>
                </div>
                <ul class="services" w-if="streamParts.length">
                    <li class="service" w-for="part in streamParts traceby part.id">{{ part.text }}</li>
                </ul>
                <p class="note" w-if="streamDone">{{ texts.httpapi.stream_closed }}</p>
                <p class="note" w-if="!streamParts.length && !streamDone">{{ texts.httpapi.stream_empty }}</p>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.service.title }}
                    <span class="engine">engine/service</span>
                </h2>
                <p class="note">
                    {{ texts.service.note }}
                </p>
                <table class="table" w-if="services.length">
                    <thead>
                        <tr>
                            <th>{{ texts.service.col_name }}</th>
                            <th>{{ texts.service.col_running }}</th>
                            <th>{{ texts.service.col_ready }}</th>
                            <th>{{ texts.service.col_restarts }}</th>
                            <th>{{ texts.service.col_failure }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr w-for="row in services traceby row.name">
                            <td>{{ row.name }}</td>
                            <td>{{ row.running }}</td>
                            <td>{{ row.ready }}</td>
                            <td>{{ row.restarts }}</td>
                            <td class="text">{{ row.failure }}</td>
                        </tr>
                    </tbody>
                </table>
                <p class="note" w-if="!services.length">{{ texts.service.empty }}</p>
                <div class="line">
                    <button class="button" w-on="click:crashWatch">{{ texts.service.crash }}</button>
                </div>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.jobs.title }}
                    <span class="engine">engine/jobs</span>
                </h2>
                <p class="note">
                    {{ texts.jobs.note }}
                </p>
                <div class="line">
                    <input class="input" w-bind="text" placeholder="{{ texts.jobs.field_text }}">
                    <input class="input" type="number" min="0" w-bind="delaySeconds" placeholder="{{ texts.jobs.field_delay }}">
                    <input class="input" type="number" min="0" w-bind="slowMs" placeholder="{{ texts.jobs.field_slow }}">
                    <button class="button" w-on="click:enqueue">{{ texts.jobs.enqueue }}</button>
                </div>
                <p class="label" w-if="jobs.length">{{ texts.jobs.list_label }}</p>
                <div class="scroll" w-if="jobs.length" w-stick>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>{{ texts.jobs.col_id }}</th>
                                <th>{{ texts.jobs.col_kind }}</th>
                                <th>{{ texts.jobs.col_status }}</th>
                                <th>{{ texts.jobs.col_attempts }}</th>
                                <th>{{ texts.jobs.col_not_before }}</th>
                                <th>{{ texts.jobs.col_created }}</th>
                                <th>{{ texts.jobs.col_started }}</th>
                                <th>{{ texts.jobs.col_text }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr w-for="row in jobs traceby row.id">
                                <td>{{ row.id }}</td>
                                <td>{{ row.kind }}</td>
                                <td>{{ row.status }}</td>
                                <td>{{ row.attempts }}</td>
                                <td>{{ row.notBefore }}</td>
                                <td>{{ row.createdAt }}</td>
                                <td>{{ row.startedAt }}</td>
                                <td class="text">{{ row.text }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="note" w-if="!jobs.length">{{ texts.jobs.empty }}</p>
                <button class="button" w-on="click:refreshQueue">{{ texts.jobs.refresh }}</button>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.events.title }}
                    <span class="engine">engine/events</span>
                </h2>
                <p class="note">
                    {{ texts.events.note }}
                </p>
                <div class="line">
                    <input class="input" w-bind="eventText" placeholder="{{ texts.events.field_text }}">
                    <input class="input period" w-bind="eventSeconds" type="number" min="1" max="3600">
                    <button class="button" w-on="click:addEvent">{{ texts.events.add }}</button>
                </div>
                <p class="label" w-if="events.length">{{ texts.events.list_label }}</p>
                <table class="table" w-if="events.length">
                    <thead>
                        <tr>
                            <th>{{ texts.events.col_id }}</th>
                            <th>{{ texts.events.col_kind }}</th>
                            <th>{{ texts.events.col_period }}</th>
                            <th>{{ texts.events.col_next }}</th>
                            <th>{{ texts.events.col_source }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr w-for="row in events traceby row.id">
                            <td>{{ row.id }}</td>
                            <td>{{ row.kind }}</td>
                            <td>{{ row.period }}</td>
                            <td>{{ row.next }}</td>
                            <td>{{ row.source }}</td>
                        </tr>
                    </tbody>
                </table>
                <div class="deletebar" w-if="deletable.length">
                    <span class="hint">{{ texts.events.delete_hint }}</span>
                    <div class="select mode simple" w-class="{ 'open': selects.deleteMode.open }">
                        <div class="selected" data-select="deleteMode" w-on="click:toggleSelect">
                            <span class="value">{{ selects.deleteMode.label || texts.events.mode_event }}</span>
                            <span class="caret">▾</span>
                        </div>
                        <div class="options" w-if="selects.deleteMode.open">
                            <div class="option" data-select="deleteMode" data-value="event"
                                 w-on="click:pickSelect">{{ texts.events.mode_event }}</div>
                            <div class="option" data-select="deleteMode" data-value="event-and-jobs"
                                 w-on="click:pickSelect">{{ texts.events.mode_event_jobs }}</div>
                        </div>
                    </div>
                    <div class="select pick simple" w-class="{ 'open': selects.deleteId.open }">
                        <div class="selected" data-select="deleteId" w-on="click:toggleSelect">
                            <span class="value">{{ selects.deleteId.label || texts.events.choose }}</span>
                            <span class="caret">▾</span>
                        </div>
                        <div class="options" w-if="selects.deleteId.open">
                            <div class="option" w-for="row in deletable traceby row.id"
                                 data-select="deleteId" data-value="{{ row.id }}"
                                 w-on="click:pickSelect">{{ row.id }}</div>
                        </div>
                    </div>
                    <button class="button" w-on="click:deleteEvent"
                            w-disabled="!selects.deleteId.value">{{ texts.events.delete }}</button>
                </div>
                <p class="note" w-if="!events.length">{{ texts.events.empty }}</p>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.gate.title }}
                    <span class="engine">engine/gate</span>
                </h2>
                <p class="note">
                    {{ texts.gate.note }}
                </p>
                <div class="line">
                    <input class="input" type="number" min="0" max="20000" w-bind="generateMs" placeholder="{{ texts.gate.field_ms }}">
                    <button class="button" w-on="click:generateNow">{{ texts.gate.now }}</button>
                    <button class="button" w-on="click:generateQueued">{{ texts.gate.queued }}</button>
                </div>
                <p class="note" w-if="generateResult">{{ generateResult }}</p>
                <p class="label">
                    {{ texts.gate.stats | fill:gate.capacity:gate.active:gate.peak }}
                </p>
            </section>

            <!-- Модуль-пример: словарь берёт серверный код, а не страница.
                 Подпись — domains/log_ru, потому что это модуль, а не механизм. -->
            <section class="block">
                <h2 class="caption">
                    {{ texts.log_ru.title }}
                    <span class="engine">domains/log_ru</span>
                </h2>
                <p class="note">
                    {{ texts.log_ru.note }}
                </p>
                <div class="line">
                    <button class="button" w-on="click:writeLog">{{ texts.log_ru.button }}</button>
                </div>
                <p class="note" w-if="logResult">{{ logResult }}</p>
                <p class="note" w-if="!logResult">{{ texts.log_ru.empty }}</p>
            </section>

            <section class="block">
                <h2 class="caption">
                    {{ texts.interface.title }}
                    <span class="engine">interface</span>
                </h2>
                <p class="note">
                    {{ texts.interface.note }}
                </p>

                <div class="columns">
                    <div class="column">
                        <p class="label">{{ texts.interface.group_plain }}</p>

                        <p class="label">{{ texts.interface.simple }}</p>
                        <div class="select simple" w-class="{ 'open': selects.color.open }">
                            <div class="selected" data-select="color" w-on="click:toggleSelect">
                                <span class="value">{{ selects.color.label }}</span>
                                <span class="caret">▾</span>
                            </div>
                            <div class="options" w-if="selects.color.open">
                                <div class="option" w-for="item in colors traceby item"
                                     data-select="color" data-value="{{ item }}"
                                     w-on="click:pickSelect">{{ item }}</div>
                            </div>
                        </div>

                        <p class="label">{{ texts.interface.searchable }}</p>
                        <div class="select searchable" w-class="{ 'open': selects.city.open }">
                            <div class="selected" data-select="city" w-on="click:toggleSelect">
                                <span class="value">{{ selects.city.label || texts.interface.choose_city }}</span>
                                <span class="caret">▾</span>
                            </div>
                            <div class="options" w-if="selects.city.open">
                                <div class="search">
                                    <input class="input" w-bind="selects.city.query"
                                           w-on="input:filterCities" w-focus placeholder="{{ texts.common.search }}">
                                </div>
                                <div class="option" w-for="item in cityMatches traceby item"
                                     data-select="city" data-value="{{ item }}"
                                     w-on="click:pickSelect">{{ item }}</div>
                            </div>
                        </div>

                        <p class="label">{{ texts.interface.multiple }}</p>
                        <div class="select multiple" w-class="{ 'open': selects.tags.open }">
                            <div class="selected" data-select="tags" w-on="click:toggleSelect">
                                <span class="value">{{ selects.tags.value.join(', ') || texts.common.empty_choice }}</span>
                                <span class="caret">▾</span>
                            </div>
                            <div class="options" w-if="selects.tags.open">
                                <div class="option" w-for="item in tags traceby item"
                                     w-class="{ 'picked': selects.tags.value.includes(item) }"
                                     data-select="tags" data-value="{{ item }}"
                                     w-on="click:pickSelect">{{ item }}</div>
                            </div>
                        </div>
                    </div>

                    <div class="column">
                        <p class="label">{{ texts.interface.group_components }}</p>

                        <p class="label">{{ texts.interface.simple }}</p>
                        <x-select :items="colorItems" :value="componentColor"
                                  :empty="texts.common.empty_choice"
                                  @change="onComponentColor"></x-select>

                        <p class="label">{{ texts.interface.searchable }}</p>
                        <x-select-search :items="cityItems" :value="componentCity"
                                         :empty="texts.common.empty_choice"
                                         :search="texts.common.search"
                                         @change="onComponentCity"></x-select-search>

                        <p class="label">{{ texts.interface.multiple }}</p>
                        <x-select-multi :items="tagItems" :value="componentTags"
                                        :empty="texts.common.empty_choice"
                                        @change="onComponentTags"></x-select-multi>
                    </div>
                </div>
            </section>

            <footer class="actions">
                <button class="button" w-on="click:refresh" w-disabled="checking">
                    {{ texts.common.refresh_all }}
                </button>
                <span class="hint">
                    {{ texts.common.refresh_hint }}
                </span>
            </footer>
        </main>
    </template>

    <!--
        Компонент выпадающего списка. Разметка одна на все экземпляры,
        состояние у каждого своё; выбранное значение уходит родителю
        событием change.

        Аудит wex, 2026-11-26. Это НЕ задание на переделку: код оставлен как
        есть, перечисленное ниже — напоминание перепроверить при обновлении
        wex (подробный список — в начале interface/app.js).

        data-value — DOM-атрибут, поэтому значение пункта возвращается строкой,
        даже если в items лежит число. Подсветка ниже сравнивает
        value === item.value, так что числовые значения потеряют подсветку.
        Сейчас значения строковые, поэтому не проявляется.

        w-on="click:pick" опирается на то, что ядро подставляет найденный
        элемент в event.currentTarget: из него pick берёт data-value.
    -->
    <template id="x-select">
        <div class="select widget simple" w-class="{ 'open': open }">
            <div class="selected" w-on="click:toggle">
                <span class="value">{{ value || empty }}</span>
                <span class="caret">▾</span>
            </div>
            <div class="options" w-if="open">
                <div class="option" w-for="item in items traceby item.value"
                     w-class="{ 'picked': value === item.value }"
                     data-value="{{ item.value }}"
                     w-on="click:pick">{{ item.label }}</div>
            </div>
        </div>
    </template>

    <!--
        Список с поиском. Аудит wex 2026-11-26: пункты берутся из matches —
        это кэш, который пересчитывается только при открытии и при вводе.
        Если родитель подменит :items при открытом меню, список покажет
        старые пункты до закрытия. Сейчас items статические; подробности
        и варианты — в комментарии к x-select-search в app.js.
    -->
    <template id="x-select-search">
        <div class="select widget searchable" w-class="{ 'open': open }">
            <div class="selected" w-on="click:toggle">
                <span class="value">{{ value || empty }}</span>
                <span class="caret">▾</span>
            </div>
            <div class="options" w-if="open">
                <div class="search">
                    <input class="input" w-bind="query" w-on="input:filter"
                           w-focus placeholder="{{ search }}">
                </div>
                <div class="option" w-for="item in matches traceby item.value"
                     data-value="{{ item.value }}" w-on="click:pick">{{ item.label }}</div>
            </div>
        </div>
    </template>

    <!--
        Множественный выбор. Аудит wex 2026-11-26: value.join и value.includes
        требуют массива — если в :value придёт строка или null, выражения
        шаблона будут падать на каждом рендере. Значение пункта приходит
        строкой из data-value, как и в двух списках выше.
    -->
    <template id="x-select-multi">
        <div class="select widget multiple" w-class="{ 'open': open }">
            <div class="selected" w-on="click:toggle">
                <span class="value">{{ value.join(', ') || empty }}</span>
                <span class="caret">▾</span>
            </div>
            <div class="options" w-if="open">
                <div class="option" w-for="item in items traceby item.value"
                     w-class="{ 'picked': value.includes(item.value) }"
                     data-value="{{ item.value }}" w-on="click:pick">{{ item.label }}</div>
            </div>
        </div>
    </template>

    <!--
        Порядок важен: jQuery, затем wex, затем код приложения.

        У wex 3 есть свой мини-$, и библиотека работает без jQuery. Проект
        пока подключает jQuery первым: wex его подхватывает, и `$el`
        в директивах остаётся полным jQuery. Проверенная связка важнее
        экономии восьмидесяти килобайт: отказ от jQuery — отдельная правка
        с проверкой всех экранов, а не побочный эффект обновления.
    -->
    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/wex.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
