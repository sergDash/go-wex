<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>go + wex — панель демо</title>
    <!-- Зелёная точка вкладки: без файла браузер просит /favicon.ico и получает 404. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!--
        Исходник стилей — Less. less.js компилирует его в браузере,
        поэтому сборщик для CSS не нужен. Скрипт идёт сразу после link:
        он ищет все ссылки с rel="stylesheet/less".
    -->
    <link rel="stylesheet/less" type="text/css" href="/style.less">
    <script src="/vendor/less.js"></script>
</head>
<body>
    <!--
        Шаблон wex. Движок читает его содержимое как виртуальное дерево
        и вставляет отрисованный результат после самого <template>.
        Идентификатор app — точка привязки для $('#app') в app.js.
    -->
    <template id="app">
        <main class="panel">
            <!--
                Шапка не зависит от стейта, поэтому помечена w-static:
                перерисовки её не касаются.
            -->
            <header class="head" w-static>
                <h1 class="title">Движок go + wex: панель демо</h1>
                <p class="lead">
                    Каждая секция показывает один механизм движка: рядом
                    с заголовком — имя пакета, который за него отвечает.
                    Пояснение говорит, зачем механизм придуман и что нажать,
                    чтобы увидеть его в работе.
                </p>
            </header>

            <p class="failure" w-if="failure">{{ failure }}</p>

            <section class="block" w-static>
                <h2 class="caption">
                    Модули и механизмы
                    <span class="engine">engine/core</span>
                </h2>
                <p class="note">
                    Движок — это набор механизмов и стандарт, по которому к нему
                    подключаются модули. Механизм — часть движка: очередь,
                    события, службы, часы, журнал, HTTP. Он не знает, кто им
                    пользуется. Модуль — пакет, который подключается к ядру и
                    объявляет, что умеет: маршруты, работы, события, службы,
                    подкоманды. Поэтому <code>engine/jobs</code> — механизм,
                    а <code>domains/demo</code> — модуль. Модуль можно выключить
                    настройкой, механизм — нет: он и есть движок.
                </p>
                <p class="note">
                    Слово «механизм» выбрано, чтобы не говорить «ядровый
                    модуль»: иначе к каждому модулю нужно уточнение, ядровый
                    он или внешний. Подписи <code>engine/…</code> в заголовках
                    называют механизм, а разделы показывают, что на нём
                    собрано.
                </p>
            </section>

            <section class="block">
                <h2 class="caption">
                    Связь с сервером
                    <span class="engine">engine/httpapi</span>
                </h2>
                <p class="note">
                    Самое простое, что умеет приложение: ответить на запрос.
                    Ответ всегда в общем конверте — данные в result, ошибка
                    в error, — поэтому клиенту не нужно угадывать форму.
                    Кнопка повторяет запрос <code>GET /api/health</code>,
                    чтобы его было видно в сетевой панели инструментов.
                </p>
                <div class="probe">
                    <p class="status" w-class="{ 'ok': ok, 'error': !checking && !ok }">
                        <span class="dot"></span>{{ status }}
                    </p>
                    <button class="button" w-on="click:check" w-disabled="checking">Проверить</button>
                </div>
            </section>

            <section class="block">
                <h2 class="caption">
                    Службы
                    <span class="engine">engine/service</span>
                </h2>
                <p class="note">
                    Служба — часть приложения, которая живёт всё время работы:
                    HTTP-сервер, разборщик очереди, события, журнал, слушатели
                    и дочерний процесс демо-модуля. Движок поднимает их по
                    списку, а при остановке гасит в обратном порядке: сначала
                    перестаёт принимать запросы, затем освобождает порты,
                    закрывает файлы и завершает процессы.
                </p>
                <ul class="services">
                    <li class="service" w-for="name in services traceby name">{{ name }}</li>
                </ul>
                <p class="note" w-if="!services.length">Служб нет.</p>
            </section>

            <section class="block">
                <h2 class="caption">
                    Работа в очереди
                    <span class="engine">engine/jobs</span>
                </h2>
                <p class="note">
                    Долгую работу не делают внутри ответа: клиент ждал бы,
                    а соединение могло оборваться. Запрос только ставит
                    работу в очередь и сразу получает номер, а выполняет её
                    разборщик — отдельная служба. Работа переживает
                    перезапуск, повторяется после ошибки и видна снаружи по
                    статусу. Введите текст и нажмите «Поставить»: строка
                    появится в таблице, а работу разборщик возьмёт, когда
                    приложение простаивает.
                </p>
                <div class="line">
                    <input class="input" w-bind="text" placeholder="текст работы">
                    <button class="button" w-on="click:enqueue">Поставить</button>
                </div>
                <p class="label" w-if="jobs.length">Прокручиваемый список</p>
                <div class="scroll" w-if="jobs.length" w-stick>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>№</th>
                                <th>Вид</th>
                                <th>Статус</th>
                                <th>Попытка</th>
                                <th>Создана</th>
                                <th>Начата</th>
                                <th>Текст</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr w-for="row in jobs traceby row.id">
                                <td>{{ row.id }}</td>
                                <td>{{ row.kind }}</td>
                                <td>{{ row.status }}</td>
                                <td>{{ row.attempts }}</td>
                                <td>{{ row.createdAt }}</td>
                                <td>{{ row.startedAt }}</td>
                                <td class="text">{{ row.text }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="note" w-if="!jobs.length">Очередь пуста.</p>
                <button class="button" w-on="click:refreshQueue">Обновить очередь</button>
            </section>

            <section class="block">
                <h2 class="caption">
                    Отложенные события
                    <span class="engine">engine/events</span>
                </h2>
                <p class="note">
                    Иногда работу ставит не человек, а время: напоминание,
                    отчёт, уборка. Событие — это срок, по которому движок сам
                    ставит работу. Одно событие объявлено кодом
                    (<code>demo.tick</code> раз в десять секунд), остальные
                    можно добавить формой: текст работы и период в секундах.
                    Срок лежит в хранилище, поэтому событие переживает
                    перезапуск, а пропущенные сроки дают одно срабатывание.
                </p>
                <div class="line">
                    <input class="input" w-bind="eventText" placeholder="текст работы">
                    <input class="input period" w-bind="eventSeconds" type="number" min="1" max="3600">
                    <button class="button" w-on="click:addEvent">Добавить событие</button>
                </div>
                <p class="label" w-if="events.length">События</p>
                <table class="table" w-if="events.length">
                    <thead>
                        <tr>
                            <th>Событие</th>
                            <th>Вид</th>
                            <th>Период</th>
                            <th>Сработает</th>
                            <th>Источник</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr w-for="row in events traceby row.id">
                            <td>{{ row.id }}</td>
                            <td>{{ row.kind }}</td>
                            <td>{{ row.period }}</td>
                            <td>{{ row.next }}</td>
                            <td>{{ row.source }}</td>
                        </tr>
                    </tbody>
                </table>
                <div class="deletebar" w-if="deletable.length">
                    <span class="hint">Удалить:</span>
                    <div class="select mode simple" w-class="{ 'open': selects.deleteMode.open }">
                        <div class="selected" data-select="deleteMode" w-on="click:toggleSelect">
                            <span class="value">{{ selects.deleteMode.label }}</span>
                            <span class="caret">▾</span>
                        </div>
                        <div class="options" w-if="selects.deleteMode.open">
                            <div class="option" data-select="deleteMode" data-value="event"
                                 w-on="click:pickSelect">только событие</div>
                            <div class="option" data-select="deleteMode" data-value="event-and-jobs"
                                 w-on="click:pickSelect">вместе с работами (пока не сделано)</div>
                        </div>
                    </div>
                    <div class="select pick simple" w-class="{ 'open': selects.deleteId.open }">
                        <div class="selected" data-select="deleteId" w-on="click:toggleSelect">
                            <span class="value">{{ selects.deleteId.label }}</span>
                            <span class="caret">▾</span>
                        </div>
                        <div class="options" w-if="selects.deleteId.open">
                            <div class="option" w-for="row in deletable traceby row.id"
                                 data-select="deleteId" data-value="{{ row.id }}"
                                 w-on="click:pickSelect">{{ row.id }}</div>
                        </div>
                    </div>
                    <button class="button" w-on="click:deleteEvent"
                            w-disabled="!selects.deleteId.value">Удалить</button>
                </div>
                <p class="note" w-if="!events.length">Событий нет.</p>
            </section>

            <section class="block">
                <h2 class="caption">
                    Селекторы
                    <span class="engine">interface</span>
                </h2>
                <p class="note">
                    Выпадающие списки сделаны из своих элементов, а не из
                    браузерного <code>select</code>: так они выглядят одинаково
                    и управляются тем же стейтом, что и остальная страница.
                    Данные лежат локально — выбор никуда не отправляется.
                </p>

                <p class="label">Виджет на компоненте</p>
                <div class="line">
                    <x-select class="demo" :items="colorItems" :value="componentColor"
                              @change="onComponentColor"></x-select>
                    <span class="hint">выбрано: {{ componentColor || '—' }}</span>
                </div>

                <p class="label">Простой выбор</p>
                <div class="select demo simple" w-class="{ 'open': selects.color.open }">
                    <div class="selected" data-select="color" w-on="click:toggleSelect">
                        <span class="value">{{ selects.color.label }}</span>
                        <span class="caret">▾</span>
                    </div>
                    <div class="options" w-if="selects.color.open">
                        <div class="option" w-for="item in colors traceby item"
                             data-select="color" data-value="{{ item }}"
                             w-on="click:pickSelect">{{ item }}</div>
                    </div>
                </div>

                <p class="label">Выбор с поиском</p>
                <div class="select demo searchable" w-class="{ 'open': selects.city.open }">
                    <div class="selected" data-select="city" w-on="click:toggleSelect">
                        <span class="value">{{ selects.city.label }}</span>
                        <span class="caret">▾</span>
                    </div>
                    <div class="options" w-if="selects.city.open">
                        <div class="search">
                            <input class="input" w-bind="selects.city.query"
                                   w-on="input:filterCities" w-focus placeholder="поиск">
                        </div>
                        <div class="option" w-for="item in cityMatches traceby item"
                             data-select="city" data-value="{{ item }}"
                             w-on="click:pickSelect">{{ item }}</div>
                    </div>
                </div>

                <p class="label">Множественный выбор</p>
                <div class="select demo multiple" w-class="{ 'open': selects.tags.open }">
                    <div class="selected" data-select="tags" w-on="click:toggleSelect">
                        <span class="value">{{ selects.tags.value.join(', ') || '— не выбрано —' }}</span>
                        <span class="caret">▾</span>
                    </div>
                    <div class="options" w-if="selects.tags.open">
                        <div class="option" w-for="item in tags traceby item"
                             w-class="{ 'picked': selects.tags.value.includes(item) }"
                             data-select="tags" data-value="{{ item }}"
                             w-on="click:pickSelect">{{ item }}</div>
                    </div>
                </div>
            </section>

            <footer class="actions">
                <button class="button" w-on="click:refresh" w-disabled="checking">
                    Обновить всё
                </button>
                <span class="hint">
                    Перечитывает все разделы сразу: связь, службы, очередь
                    и событие. Опроса нет — данные меняются только после
                    нажатия; канал обновлений без опроса — сценарий SC-16,
                    он ещё не сделан.
                </span>
            </footer>
        </main>
    </template>

    <!--
        Компонент выпадающего списка. Разметка одна на все экземпляры,
        состояние у каждого своё; выбранное значение уходит родителю
        событием change.
    -->
    <template id="x-select">
        <div class="select widget simple" w-class="{ 'open': open }">
            <div class="selected" w-on="click:toggle">
                <span class="value">{{ value || '— не выбрано —' }}</span>
                <span class="caret">▾</span>
            </div>
            <div class="options" w-if="open">
                <div class="option" w-for="item in items traceby item.value"
                     w-class="{ 'picked': value === item.value }"
                     data-value="{{ item.value }}"
                     w-on="click:pick">{{ item.label }}</div>
            </div>
        </div>
    </template>

    <!--
        Порядок важен: jQuery, затем wex, затем код приложения.

        У wex 3 есть свой мини-$, и библиотека работает без jQuery. Проект
        пока подключает jQuery первым: wex его подхватывает, и `$el`
        в директивах остаётся полным jQuery. Проверенная связка важнее
        экономии восьмидесяти килобайт: отказ от jQuery — отдельная правка
        с проверкой всех экранов, а не побочный эффект обновления.
    -->
    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/wex.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
